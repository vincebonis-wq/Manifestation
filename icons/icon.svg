<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1e24"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c886"/>
      <stop offset="52%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8f7134"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Ouroboros : serpent-dragon en cercle, mordant sa queue -->
  <g transform="translate(0 8)">
    <path d="M 256 96 A 160 160 0 1 1 210 110" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
    <!-- tête du dragon (haut gauche) -->
    <path d="M 210 110 q -40 -8 -58 20 q 26 6 34 28 q 18 -24 52 -20 q 6 -16 -28 -28 z" fill="url(#gold)"/>
    <!-- queue effilée qui entre dans la gueule (haut droite) -->
    <path d="M 256 96 q 30 -2 46 12 q -24 8 -46 4 z" fill="url(#gold)"/>
    <circle cx="182" cy="136" r="6" fill="#14100a"/>
  </g>

  <!-- étoile centrale ✦ (la manifestation au cœur du cycle) -->
  <g fill="url(#gold)" transform="translate(256 264)">
    <path d="M0 -56 C 7 -17 17 -7 56 0 C 17 7 7 17 0 56 C -7 17 -17 7 -56 0 C -17 -7 -7 -17 0 -56 Z"/>
  </g>
</svg>
