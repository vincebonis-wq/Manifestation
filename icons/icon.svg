<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15161d"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c884"/>
      <stop offset="55%" stop-color="#d9b876"/>
      <stop offset="100%" stop-color="#a07d3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#d9b876" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d9b876" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- radiant star / sun of manifestation -->
  <g transform="translate(256 232)" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-118" x2="0" y2="-84"/>
    <line x1="0" y1="118" x2="0" y2="84"/>
    <line x1="-118" y1="0" x2="-84" y2="0"/>
    <line x1="118" y1="0" x2="84" y2="0"/>
    <line x1="-83" y1="-83" x2="-59" y2="-59"/>
    <line x1="83" y1="83" x2="59" y2="59"/>
    <line x1="-83" y1="83" x2="-59" y2="59"/>
    <line x1="83" y1="-83" x2="59" y2="-59"/>
  </g>
  <circle cx="256" cy="232" r="52" fill="url(#gold)"/>
  <!-- monogram M -->
  <text x="256" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700"
        text-anchor="middle" dominant-baseline="central" fill="#14100a">M</text>
  <!-- wordmark -->
  <text x="256" y="392" font-family="Georgia, serif" font-size="46" letter-spacing="6"
        text-anchor="middle" fill="url(#gold)">MANIFEST</text>
</svg>
